# Fly.io — https://fly.io
# Étapes :
#   fly launch --no-deploy            (crée l'app, garde ce fichier)
#   fly volumes create wavesoft_data --size 1
#   fly secrets set JWT_SECRET=$(openssl rand -hex 32)
#   fly deploy
app = "ws-autorisation"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  JWT_EXPIRES = "12h"
  # JWT_SECRET est fourni via `fly secrets set` (jamais dans ce fichier).

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "wavesoft_data"
  destination = "/app/backend/data"
