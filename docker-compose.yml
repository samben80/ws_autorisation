# Déploiement full-stack (VPS / local). Un seul service : API + frontend.
# Usage :
#   JWT_SECRET=$(openssl rand -hex 32) docker compose up -d --build
services:
  app:
    build: .
    ports:
      - '8787:8787'
    environment:
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET (ex. openssl rand -hex 32)}
      JWT_EXPIRES: '12h'
      PORT: '8787'
    volumes:
      - wavesoft-data:/app/backend/data
    restart: unless-stopped

volumes:
  wavesoft-data:
